# gitleaks 설정: 푸시 전 훅(scripts/githooks/pre-push)과 대화록 검사(scripts/archive_conversation.py)가
# 레포 루트의 이 파일을 쓴다. 기본 규칙에 더해 아래 규칙을 추가한다.
# 근거: 기본 규칙은 `OPENROUTER_API_KEY=...` 대입 형태만 잡고 문장 속의 키 문자열은 잡지 못했다
# (2026-10-28 가짜 값으로 확인). 다른 제공자의 키를 쓰게 되면 같은 방식으로 규칙을 한 개 추가한다.
title = "hermes-agent-study gitleaks"

[extend]
useDefault = true

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key (sk-or-v1-...)"
regex = '''sk-or-v1-[A-Za-z0-9]{32,}'''
keywords = ["sk-or-v1-"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key (sk-ant-...)"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "gemini-api-key"
description = "Google Gemini API key (AIzaSy...)"
regex = '''AIzaSy[A-Za-z0-9_-]{33}'''
keywords = ["AIzaSy"]

# 시험용 가짜 키 상수 허용 (RULE-004). 04 구현 커밋의 시험 코드(`fake_key = "..."` 등)가 generic-api-key에 걸려
# 푸시가 막혔다(2026-10-28). 허용 범위는 코어 시험 코드 한 곳과 이 규칙 하나로 좁힌다:
# tests/test_hermes_core/ 아래 .py 파일의 generic-api-key만 제외하며, openrouter-api-key 규칙과
# 그 밖의 모든 경로(src, docs, tests/test_scripts 등)는 그대로 검출한다.
[[allowlists]]
description = "코어 시험 코드의 가짜 키 상수"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_hermes_core/.*\.py$''']

[[allowlists]]
description = "로드맵 23 구현지시서 인수 테스트 시나리오의 가짜 Gemini 키 예시"
targetRules = ["generic-api-key"]
regexes = ['''AIzaSyTestKey1234567890''']

[[allowlists]]
description = "로드맵 23 구현지시서 인수 테스트 시나리오의 가짜 Anthropic 키 예시"
targetRules = ["anthropic-api-key"]
regexes = ['''sk-ant-DummyToken1234567890''']
