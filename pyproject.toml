[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent-study"
version = "0.1.0"
description = "Study lab and minimal working implementation of Hermes Agent core mechanisms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "prompt_toolkit>=3.0.52,<4",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = ["pytest-xdist>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = ["pty: 가상 터미널(pty)로 실제 CLI 프로세스를 띄우는 느린 시험 (파일명 *_pty.py 에 자동 부여)"]
